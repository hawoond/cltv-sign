name: cltv_sign
description: "전자서명 플랫폼 - cltv-sign"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.3
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  intl: ^0.19.0
  file_picker: ^8.1.7
  signature: ^5.5.0
  pdf: ^3.11.1
  printing: ^5.13.2
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  fl_chart: ^0.69.0
  flutter_svg: ^2.0.10+1
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  flutter_secure_storage: ^9.2.2
  pinput: ^5.0.0
  dotted_border: ^2.1.0
  percent_indicator: ^4.2.3
  badges: ^3.1.2
  hand_signature: ^3.1.0
  syncfusion_flutter_pdfviewer: ^27.2.2
  syncfusion_flutter_pdf: ^27.2.2
  path_provider: ^2.1.5
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
